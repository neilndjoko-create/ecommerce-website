{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="stylesheet" href="{% static 'CSS/style.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/front.css/fontawesome-free-7.3.0-web/css/all.min.css' %}">

</head>

<body>

    <div id="navbar"></div>


    <main>
        <h1 id="shop">Shop</h1>
        <h5>Categories</h5>
        <section class="container_s d-flex flex-column flex-md-row gap-3 mt-3 mt-md-3 ">

            <section class="fw-bold  gap-4 bg-light h-100  p-0 row" id="side_bar">

                <div class="gap-4 ">
                    <div class=" gap-5 col-12">
                        <a href="{% url 'product_list' %}" class="btn btn-outline-success border-0 w-100"><i class="fa-solid fa-home "></i>  All</a>
                    </div>

                    {% for category in categories %}
                    <div class="sideicon gap-5 col-12">
                        <a href="{% url 'category_product' category.slug %}" class="btn  btn-outline-success border-0 w-100">
                    {{category.name}}</a>
                    </div>
                    {% endfor %}



            </section>
            <section class="container-fluid">
                <div class="row g-4">
                    {% for product in products %}
                    <div class="col-6 col-md-4 col-lg-3 bg-light ">
                        <div class="card w-100 boder-0 shadow-md " id="p_card">
                            <a href="{% url 'product_detail' product.slug %}" class="">
                                <div class="ratio ratio-1x1" id="img_p">
                                    <img src="{{ product.image.url}} " class="object-fit-cover " alt="{{ product.name }} ">
                                    <span class="like"><i class="fa-solid fa-heart btn text-danger"></i></span>
                                </div>
                            </a>
                            <div class="card-body text-center display-flex lex-column">
                                <a href="{% url 'product_detail' product.slug %}" class=" text-dark text-decoration-none">
                                    <h6 class="card-title mb-1">{{ product.name }}</h6>
                                </a>
                                <p class="card-text fw-bold mb-1">{{ product.price|floatformat:0 }} FCFA</p>
                                <a href="# " class="btn btn-primary mt-auto"> <i class="fa-solid fa-shopping-cart"></i> Add to Cart</a>
                            </div>
                        </div>
                    </div>
                    {% empty %}
                    <p>No product yet .</p>
                    {% endfor %}
                </div>
            </section>

        </section>

    </main>

    <div id="footer"></div>

    <script src="{% static 'js/jquery/jquery-4.0.0.min.js' %} "></script>
    <script src="{% static 'js/bootstrap-5.0.2-dist/js/bootstrap.min.js' %} "></script>
    <script src="{% static 'js/component.js' %} "></script>
    <script src="{% static 'js/cart.js' %} "></script>
    <script src="{% static 'js/main.js' %} "></script>
    <script src="{% static 'js/product.js' %} "></script>
    <script>
        loadNavbar();
        loadFooter();
    </script>
</body>


</html>
